<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מגרש — קדימה-צורן ופרו סוקר</title>
<style>
  :root {
    --bg: #f3f6f3;
    --surface: #ffffff;
    --surface-2: #eaf1ec;
    --border: #d7e2da;
    --text: #10201a;
    --muted: #56685e;
    --muted-2: #7c8d82;
    --accent: #17864a;
    --accent-ink: #ffffff;
    --accent-soft: #e2f3e7;
    --gold: #a06c0a;
    --gold-soft: #faf1de;
    --shadow: 0 1px 2px rgba(16, 32, 26, 0.06), 0 8px 24px -12px rgba(16, 32, 26, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1310; --surface: #101c16; --surface-2: #16241c; --border: #223229;
      --text: #eaf3ee; --muted: #9ab3a4; --muted-2: #7e9689;
      --accent: #3ecf7a; --accent-ink: #06180f; --accent-soft: #16311f;
      --gold: #e8b64a; --gold-soft: #2c2413;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1310; --surface: #101c16; --surface-2: #16241c; --border: #223229;
    --text: #eaf3ee; --muted: #9ab3a4; --muted-2: #7e9689;
    --accent: #3ecf7a; --accent-ink: #06180f; --accent-soft: #16311f;
    --gold: #e8b64a; --gold-soft: #2c2413;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Arial Hebrew", Tahoma, Arial, sans-serif;
    direction: rtl; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }
  header.scoreboard {
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--border); border-radius: 16px; padding: 22px 24px;
    box-shadow: var(--shadow); margin-bottom: 22px;
  }
  .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .mark {
    width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; flex: none;
  }
  .brand h1 { margin: 0; font-size: 22px; letter-spacing: .01em; }
  .brand .clubs-line { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .updated { font-size: 12px; color: var(--muted-2); text-align: left; font-variant-numeric: tabular-nums; }
  .auto-note { font-size: 11px; color: var(--muted-2); margin-top: 4px; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  .filters select {
    appearance: none; background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; min-width: 150px; cursor: pointer;
  }
  .filters select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tabs {
    display: flex; gap: 6px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px; width: fit-content; margin: 0 0 18px;
  }
  .tab-btn {
    border: none; background: transparent; color: var(--muted); padding: 9px 20px;
    border-radius: 999px; font-size: 13px; font-weight: 600; letter-spacing: .02em; cursor: pointer;
  }
  .tab-btn.active { background: var(--accent); color: var(--accent-ink); }
  .tab-btn .count { font-variant-numeric: tabular-nums; opacity: .75; margin-inline-start: 4px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .match-list { display: flex; flex-direction: column; gap: 10px; }
  .month-heading {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted-2);
    margin: 22px 2px 4px; font-weight: 700;
  }
  .month-heading:first-child { margin-top: 4px; }
  .match-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    display: grid; grid-template-columns: 78px 1fr auto; align-items: center; gap: 14px; box-shadow: var(--shadow);
  }
  .when { text-align: center; border-inline-end: 1px solid var(--border); padding-inline-end: 14px; }
  .when .dow { font-size: 11px; color: var(--muted-2); text-transform: uppercase; letter-spacing: .04em; }
  .when .dom { font-size: 22px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .when .time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .teams { display: flex; align-items: center; justify-content: center; gap: 10px; min-width: 0; }
  .team { font-size: 14px; font-weight: 600; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score {
    font-variant-numeric: tabular-nums; font-weight: 800; font-size: 15px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 3px 10px; flex: none;
  }
  .vs { color: var(--muted-2); font-size: 12px; flex: none; }
  .tags { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .pill { font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .pill.club-0 { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .pill.club-1 { background: var(--gold-soft); color: var(--gold); border-color: transparent; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; border: 1px dashed var(--border); border-radius: 12px; }
  footer { text-align: center; color: var(--muted-2); font-size: 12px; margin-top: 40px; }
  @media (max-width: 560px) {
    .match-card { grid-template-columns: 60px 1fr; }
    .tags { grid-column: 1 / -1; flex-direction: row; justify-content: flex-start; margin-top: 6px; }
    .team { max-width: 120px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="scoreboard">
      <div class="brand-row">
        <div class="brand">
          <div class="mark">⚽</div>
          <div>
            <h1>לוח המשחקים</h1>
            <p class="clubs-line">קדימה-צורן · פרו סוקר · כל הגילאים</p>
          </div>
        </div>
        <div>
          <div class="updated" id="updated-at">טוען...</div>
          <div class="auto-note">הנתונים מתעדכנים אוטומטית מאתר ההתאחדות לכדורגל</div>
        </div>
      </div>
      <div class="filters">
        <select id="filter-club" aria-label="מועדון"><option value="">כל המועדונים</option></select>
        <select id="filter-age" aria-label="קבוצת גיל"><option value="">כל הגילאים</option></select>
        <select id="filter-season" aria-label="עונה"><option value="">כל העונות</option></select>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="upcoming">משחקים קרובים <span class="count" id="count-upcoming">0</span></button>
      <button class="tab-btn" data-tab="archive">ארכיון <span class="count" id="count-archive">0</span></button>
    </nav>

    <section id="tab-upcoming" class="tab-panel active">
      <div class="match-list" id="list-upcoming"></div>
    </section>
    <section id="tab-archive" class="tab-panel">
      <div class="match-list" id="list-archive"></div>
    </section>

    <footer>מגרש · נתונים מאתר ההתאחדות לכדורגל בישראל</footer>
  </div>

<script>
const DOW = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

const state = { all: [], club: "", age: "", season: "", clubOrder: [] };

function fmtWhen(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return { dow: DOW[d.getDay()], dom: d.getDate(), month: d.getMonth(), monthName: MONTHS[d.getMonth()], year: d.getFullYear() };
}

function clubClass(clubName) {
  let idx = state.clubOrder.indexOf(clubName);
  if (idx === -1) { state.clubOrder.push(clubName); idx = state.clubOrder.length - 1; }
  return `club-${idx % 2}`;
}

function populateSelect(id, values, current) {
  const sel = document.getElementById(id);
  const placeholder = sel.options[0];
  sel.innerHTML = "";
  sel.appendChild(placeholder);
  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = v; opt.selected = v === current;
    sel.appendChild(opt);
  });
}

function isUpcoming(g) {
  if (!g.date) return false;
  const now = new Date();
  const gameDateTime = new Date(`${g.date}T${g.time || "00:00"}:00`);
  return gameDateTime.getTime() >= now.getTime();
}

function renderCard(g, archive) {
  const homeIsUs = g.home_team === g.club_name || (g.home_team || "").includes(g.club_name);
  const homeCls = "team" + (homeIsUs ? " us" : "");
  const awayCls = "team" + (!homeIsUs ? " us" : "");
  let middle;
  if (archive && g.home_score != null && g.away_score != null) {
    middle = `<span class="${homeCls}">${g.home_team || "?"}</span><span class="score">${g.home_score} : ${g.away_score}</span><span class="${awayCls}">${g.away_team || "?"}</span>`;
  } else {
    middle = `<span class="${homeCls}">${g.home_team || "?"}</span><span class="vs">נגד</span><span class="${awayCls}">${g.away_team || "?"}</span>`;
  }
  const w = g.date ? fmtWhen(g.date) : null;
  const domStr = w ? `${String(w.dom).padStart(2,"0")}.${String(w.month+1).padStart(2,"0")}` : "--";
  return `<article class="match-card">
    <div class="when">
      <div class="dow">${w ? "יום " + w.dow : ""}</div>
      <div class="dom">${domStr}</div>
      <div class="time">${g.time || ""}</div>
    </div>
    <div class="teams">${middle}</div>
    <div class="tags">
      <span class="pill ${clubClass(g.club_name)}">${g.club_name || ""}</span>
      <span class="pill">${g.age_group || ""}</span>
    </div>
  </article>`;
}

function groupByMonth(list) {
  const groups = [];
  let lastKey = null;
  for (const g of list) {
    if (!g.date) continue;
    const w = fmtWhen(g.date);
    const key = `${w.monthName} ${w.year}`;
    if (key !== lastKey) { groups.push({ key, items: [] }); lastKey = key; }
    groups[groups.length - 1].items.push(g);
  }
  return groups;
}

function renderList(elId, list, archive) {
  const el = document.getElementById(elId);
  if (!list.length) {
    el.innerHTML = `<p class="empty">אין משחקים תואמים לסינון.</p>`;
    return;
  }
  const groups = groupByMonth(list);
  el.innerHTML = groups.map(gr =>
    `<div class="month-heading">${gr.key}</div>` + gr.items.map(g => renderCard(g, archive)).join("")
  ).join("");
}

function applyFiltersAndRender() {
  const filtered = state.all.filter(g =>
    (!state.club || g.club_name === state.club) &&
    (!state.age || g.age_group === state.age) &&
    (!state.season || g.season_label === state.season)
  );
  const upcoming = filtered.filter(isUpcoming).sort((a, b) => (a.date + (a.time||"")).localeCompare(b.date + (b.time||"")));
  const archive = filtered.filter(g => !isUpcoming(g)).sort((a, b) => (b.date + (b.time||"")).localeCompare(a.date + (a.time||"")));

  document.getElementById("count-upcoming").textContent = upcoming.length;
  document.getElementById("count-archive").textContent = archive.length;
  renderList("list-upcoming", upcoming, false);
  renderList("list-archive", archive, true);
}

async function init() {
  let data;
  try {
    const res = await fetch("games.json", { cache: "no-store" });
    data = await res.json();
  } catch (e) {
    document.getElementById("updated-at").textContent = "שגיאה בטעינת הנתונים";
    return;
  }
  state.all = data.games || [];
  document.getElementById("updated-at").textContent = data.updated_at
    ? "עודכן לאחרונה: " + new Date(data.updated_at).toLocaleString("he-IL")
    : "טרם עודכן";

  populateSelect("filter-club", [...new Set(state.all.map(g => g.club_name).filter(Boolean))].sort(), "");
  populateSelect("filter-age", [...new Set(state.all.map(g => g.age_group).filter(Boolean))].sort(), "");
  populateSelect("filter-season", [...new Set(state.all.map(g => g.season_label).filter(Boolean))].sort().reverse(), "");

  applyFiltersAndRender();
}

document.getElementById("filter-club").addEventListener("change", e => { state.club = e.target.value; applyFiltersAndRender(); });
document.getElementById("filter-age").addEventListener("change", e => { state.age = e.target.value; applyFiltersAndRender(); });
document.getElementById("filter-season").addEventListener("change", e => { state.season = e.target.value; applyFiltersAndRender(); });

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
  });
});

init();
</script>
</body>
</html>

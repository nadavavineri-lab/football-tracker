name: Scrape fixtures

on:
  schedule:
    - cron: "0 4 * * *"   # daily, 04:00 UTC (~06:00/07:00 Israel time)
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Publish data for the static site
        run: cp data/games.json public/games.json

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/games.json data/games.json
          git diff --cached --quiet || git commit -m "Update scraped fixtures"
          git push

name: Scrape fixtures

on:
  schedule:
    - cron: "0 4 * * *"   # daily, 04:00 UTC (~06:00/07:00 Israel time)
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py --debug

      - name: Show debug dumps in the log
        if: always()
        run: |
          echo "== HTTP status / page title probe =="
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(locale="he-IL")
              resp = page.goto("https://www.football.org.il/clubs/club/?club_id=4015&season_id=27", wait_until="networkidle", timeout=30000)
              print("status:", resp.status if resp else None)
              print("title:", page.title())
              print("--- first 1500 chars of body text ---")
              print(page.inner_text("body")[:1500])
              browser.close()
          PY
          echo
          echo "== data/debug files =="
          ls -la data/debug/ || echo "(no debug dir)"
          for f in data/debug/*.txt; do
            [ -f "$f" ] || continue
            echo "---- $f ($(wc -c < "$f") bytes) ----"
            head -c 1200 "$f"
            echo
          done

      - name: Publish data for the static site
        run: cp data/games.json public/games.json

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/games.json data/games.json
          git diff --cached --quiet || git commit -m "Update scraped fixtures"
          git push
